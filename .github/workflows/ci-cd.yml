name: CI-CD Pipeline (ECS + ECR)

on:
  push:
    branches: [ develop ]

jobs:
  # 1. 빌드 + 이미지 빌드 & 푸시
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Decode and export env vars
        run: |
          echo "${{ secrets.APP_ENV_B64 }}" | base64 --decode | tr -d '\r'> .env
          # .env 내용을 GitHub Actions 환경변수로 export
          while IFS='=' read -r key value; do
            if [[ ! -z "$key" && ! "$key" =~ ^# ]]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi
          done < .env

      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build (no Test)
        run: ./gradlew clean bootJar --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # 태그관리: latest, github hash 
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # 2. ECS 서비스 업데이트 (무중단 배포)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Decode and export env vars
        run: |
          echo "${{ secrets.APP_ENV_B64 }}" | base64 --decode | tr -d '\r'> .env
          # .env 내용을 GitHub Actions 환경변수로 export
          while IFS='=' read -r key value; do
            if [[ ! -z "$key" && ! "$key" =~ ^# ]]; then
              echo "$key=$value" >> $GITHUB_ENV
            fi
          done < .env

      - name: Create ECS env json
        run: |
          # (공백+# 로 시작하는 줄), (라인 끝 # 주석), (빈줄) 삭제
          ENV_VARS=$(cat .env \
          | sed 's/^[[:space:]]*#.*$//' \
          | sed 's/[[:space:]]*#.*$//' \
          | sed '/^$/d' \
          | jq -Rn '[inputs|split("=")|{name:.[0],value:.[1]}]')
          echo "$ENV_VARS" > env.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service
        env:
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE: ${{ env.ECS_SERVICE }}
          TASK_FAMILY: ${{ env.ECS_TASK_FAMILY }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. 현재 Task Definition 가져오기
          TASK_DEF=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY)
          
          # 2. 이미지 교체 + env.json 주입 → 새 revision 등록
          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
          --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
          --argjson ENV "$(cat env.json)" \
          '.taskDefinition
          | .containerDefinitions[0].image=$IMAGE
          | .containerDefinitions[0].environment=$ENV
          | {family, containerDefinitions, networkMode, requiresCompatibilities, cpu, memory, executionRoleArn, taskRoleArn}')
          
          echo "$NEW_TASK_DEF" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json
          
          # 3. 최신 revision 번호 가져오기
          REVISION=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY | jq .taskDefinition.revision)
          
          # 4. 서비스 업데이트 (새 revision 반영)
          aws ecs update-service \
          --cluster $CLUSTER \
          --service $SERVICE_NAME \
          --task-definition $TASK_FAMILY:$REVISION