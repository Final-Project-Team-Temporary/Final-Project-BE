spring:
  datasource:
    url: ${RDB_URL}
    username: ${RDB_USERNAME}
    password: ${RDB_PASSWORD}
    driver-class-name: ${RDB_DRIVER_CLASS_NAME}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true

  data:
    mongodb:
      uri: ${MONGO_URI}

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  mail:
    host: ${GMAIL_HOST}
    port: ${GMAIL_PORT}
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Quartz 설정
  quartz:
    job-store-type: jdbc  # DB에 Job 정보 저장 (재시작 시에도 유지)
    jdbc:
      initialize-schema: always  # 스키마 자동 생성
    properties:
      org.quartz.scheduler.instanceName: QuizScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 5
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}
  issuer: ${JWT_ISSUER}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}

redis:
  key:
    stream-key: ${REDIS_STREAM_KEY}
    dedup-key: ${REDIS_DEDUP_KEY}
    recommend:
      keyword-recommend: ${REDIS_KEYWORD_RECOMMEND_CACHE_PREFIX}
      common-recommend: ${REDIS_COMMON_RECOMMEND_CACHE_KEY}
      stream-key: ${REDIS_RECOMMEND_STREAM_KEY}
    recommend-result:
      stream-key: ${REDIS_RECOMMEND_RESULT_STREAM_KEY}
      consumer-group: ${REDIS_RECOMMEND_RESULT_CONSUMER_GROUP}
      consumer-name: ${REDIS_RECOMMEND_RESULT_CONSUMER_NAME}
    article-keyword:
      stream-key: ${REDIS_ARTICLE_KEYWORD_STREAM_KEY}
      consumer-group: ${REDIS_ARTICLE_KEYWORD_CONSUMER_GROUP}
      consumer-name: ${REDIS_ARTICLE_KEYWORD_CONSUMER_NAME}

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.mongodb.driver.protocol.command: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# AI 서버 설정
ai:
  server:
    base-url: ${AI_SERVER_URL} # AI 서버 주소
    timeout: ${AI_SERVER_TIMEOUT}  # 10초 타임아웃

# 비동기 설정
async:
  quiz:
    core-pool-size: ${ASYNC_QUIZ_CORE_POOL_SIZE}
    max-pool-size: ${ASYNC_QUIZ_MAX_POOL_SIZE}
    queue-capacity: ${ASYNC_QUIZ_QUEUE_CAPACITY}
    thread-name-prefix: ${ASYNC_THREAD_NAME_PREFIX}

# 퀴즈 배치 작업 설정
quiz:
  batch:
    enabled: ${QUIZ_BATCH_ENABLED}                    # 배치 활성화 여부
    cron: "${QUIZ_CRON}"             # 매일 새벽 2시 (초 분 시 일 월 요일)
    max-users-per-batch: ${QUIZ_BATCH_MAX_USERS}         # 한 번에 처리할 최대 사용자 수
    max-terms-per-user: ${QUIZ_BATCH_MAX_TERMS}           # 사용자당 최대 퀴즈 생성 용어 수
    active-days-threshold: ${QUIZ_BATCH_ACTIVE_DAYS}        # 활성 사용자 기준 (최근 30일 내 접속)
