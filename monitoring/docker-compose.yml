version: '3.8'

services:
  # Loki - 로그 저장소 (경량 버전)
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    environment:
      - LOKI_CONFIG_FILE=/etc/loki/local-config.yml
    volumes:
      - C:\Users\mirup\Final-Project-BE\monitoring\loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-storage:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus - 메트릭 저장소
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - C:\Users\mirup\Final-Project-BE\monitoring\prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring

  # Grafana - 시각화 도구
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - C:\Users\mirup\Final-Project-BE\monitoring\grafana\provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

volumes:
  loki-storage:
  prometheus-storage:
  grafana-storage:

networks:
  monitoring:
    driver: bridge
