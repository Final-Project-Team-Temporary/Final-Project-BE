global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'whiplash-monitor'

scrape_configs:
  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot 애플리케이션 메트릭
  - job_name: 'whiplash-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
    scrape_interval: 5s
    scrape_timeout: 5s

  # 선택사항: Node Exporter (시스템 메트릭)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

